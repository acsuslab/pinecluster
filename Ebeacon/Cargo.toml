[package]
name = "event_beacon"
version = "0.1.0"
edition = "2021"


[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.11", features = ["json", "default-tls"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
rsa = "0.8"
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
whoami = "1.2"
lazy_static = "1.4"
hex = "0.4"
home = "0.5"
once_cell = "1.20"
tracing = "0.1"
dashmap = "5.0"
tracing-subscriber = "0.3"


[[bin]]
name = "deploy_tool"
path = "deploy_tool.rs"

[[bin]]
name = "stop_all_beacon"
path = "stop_all_beacon.rs"
